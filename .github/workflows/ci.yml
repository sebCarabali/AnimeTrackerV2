name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]

# H6: minimum required permissions (principle of least privilege)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── T1/CA1-CA3: Detect which jobs are affected by the changed files ─────────
  detect:
    name: Detect affected jobs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install tools/ci deps
        run: pnpm --filter @animetracker/ci install

      - name: Compute changed files
        id: changed
        # H3 fix: pass SHAs via env vars instead of inline interpolation
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi
          FILES=$(git diff --name-only "$BASE"...HEAD | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      # H1 fix: run compute-matrix.ts directly via Node 22 --experimental-strip-types
      - name: Determine affected jobs
        id: set-matrix
        run: node --experimental-strip-types tools/ci/compute-matrix.ts
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}

  # ── T3: Run each affected job from the matrix ───────────────────────────────
  run-job:
    name: ${{ matrix.job }}
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # ── repo-checks ─────────────────────────────────────────────────────────
      - name: Setup pnpm (repo-checks / spa / bff / extension)
        if: matrix.job != 'core' && matrix.job != 'contracts'
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node (repo-checks / spa / bff / extension)
        if: matrix.job != 'core' && matrix.job != 'contracts'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # T4: pnpm store cache
      - name: Restore pnpm store
        if: matrix.job != 'core' && matrix.job != 'contracts'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # H2 fix: install and run both repo-checks AND ci tool suite
      - name: pnpm install (repo-checks + ci tools)
        if: matrix.job == 'repo-checks'
        run: |
          pnpm --filter @animetracker/repo-checks install
          pnpm --filter @animetracker/ci install

      - name: Run repo-checks
        if: matrix.job == 'repo-checks'
        run: pnpm --filter @animetracker/repo-checks test:coverage

      - name: Run ci-tools tests
        if: matrix.job == 'repo-checks'
        run: pnpm --filter @animetracker/ci test:coverage

      # ── core (.NET) ──────────────────────────────────────────────────────────
      - name: Setup .NET 10
        if: matrix.job == 'core'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # T4: NuGet cache
      - name: Restore NuGet cache
        if: matrix.job == 'core'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('services/core/**/*.csproj', 'services/core/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: dotnet restore
        if: matrix.job == 'core'
        run: dotnet restore services/core/AnimeTracker.sln

      - name: dotnet build
        if: matrix.job == 'core'
        run: dotnet build services/core/AnimeTracker.sln --no-restore --configuration Release

      - name: dotnet test (with coverage)
        if: matrix.job == 'core'
        run: |
          dotnet test services/core/AnimeTracker.sln \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            --logger "trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload coverage report
        if: matrix.job == 'core'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: TestResults/**/coverage.cobertura.xml

      # T5/CA5 fix (H4): enforce 80 % line coverage threshold on .NET results
      - name: Check .NET coverage threshold (80 %)
        if: matrix.job == 'core'
        run: |
          mapfile -t COVERAGE_FILES < <(find TestResults -name "coverage.cobertura.xml")
          if [ ${#COVERAGE_FILES[@]} -eq 0 ]; then
            echo "ERROR: No coverage.cobertura.xml found in TestResults"
            exit 1
          fi
          for COVERAGE_FILE in "${COVERAGE_FILES[@]}"; do
            python3 - "$COVERAGE_FILE" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse(sys.argv[1])
          rate = float(tree.getroot().get("line-rate", "0"))
          print(f"Line coverage: {rate:.1%}")
          if rate < 0.80:
              print(f"ERROR: coverage {rate:.1%} is below the 80 % threshold")
              sys.exit(1)
          print("Coverage OK (>= 80 %)")
          PYEOF
          done

      # ── contracts ────────────────────────────────────────────────────────────
      - name: Fetch origin/main for oasdiff comparison (contracts)
        if: matrix.job == 'contracts'
        run: git fetch --no-tags origin main

      - name: Install Spectral CLI (CA2)
        if: matrix.job == 'contracts'
        run: npm install -g @stoplight/spectral-cli

      - name: Lint contracts with Spectral (CA2)
        if: matrix.job == 'contracts'
        run: spectral lint contracts/public/bff.v1.yaml contracts/internal/core.v1.yaml

      - name: Install oasdiff (CA3)
        if: matrix.job == 'contracts'
        run: |
          go install github.com/oasdiff/oasdiff@latest
          sudo mv $(go env GOPATH)/bin/oasdiff /usr/local/bin/

      - name: Breaking changes — BFF público (CA3)
        if: matrix.job == 'contracts'
        run: |
          if git rev-parse --verify origin/main:contracts/public/bff.v1.yaml >/dev/null 2>&1; then
            git show origin/main:contracts/public/bff.v1.yaml > /tmp/base-bff.yaml
            BASE_MAJOR=$(grep -m1 '^\s*version:' /tmp/base-bff.yaml | tr -d '"' | tr -d "'" | sed 's/.*version:[[:space:]]*//' | cut -d. -f1 || echo "0")
            PR_MAJOR=$(grep -m1 '^\s*version:' contracts/public/bff.v1.yaml | tr -d '"' | tr -d "'" | sed 's/.*version:[[:space:]]*//' | cut -d. -f1 || echo "0")
            if [ "${PR_MAJOR:-0}" -gt "${BASE_MAJOR:-0}" ]; then
              echo "Major version bumped (${BASE_MAJOR}.x → ${PR_MAJOR}.x): skipping breaking-change check for bff.v1.yaml."
            else
              oasdiff breaking /tmp/base-bff.yaml contracts/public/bff.v1.yaml --fail-on ERR
            fi
          else
            echo "bff.v1.yaml es nuevo en este PR. Omitiendo comparación de breaking changes."
          fi

      - name: Breaking changes — Core interno (CA3)
        if: matrix.job == 'contracts'
        run: |
          if git rev-parse --verify origin/main:contracts/internal/core.v1.yaml >/dev/null 2>&1; then
            git show origin/main:contracts/internal/core.v1.yaml > /tmp/base-core.yaml
            BASE_MAJOR=$(grep -m1 '^\s*version:' /tmp/base-core.yaml | tr -d '"' | tr -d "'" | sed 's/.*version:[[:space:]]*//' | cut -d. -f1 || echo "0")
            PR_MAJOR=$(grep -m1 '^\s*version:' contracts/internal/core.v1.yaml | tr -d '"' | tr -d "'" | sed 's/.*version:[[:space:]]*//' | cut -d. -f1 || echo "0")
            if [ "${PR_MAJOR:-0}" -gt "${BASE_MAJOR:-0}" ]; then
              echo "Major version bumped (${BASE_MAJOR}.x → ${PR_MAJOR}.x): skipping breaking-change check for core.v1.yaml."
            else
              oasdiff breaking /tmp/base-core.yaml contracts/internal/core.v1.yaml --fail-on ERR
            fi
          else
            echo "core.v1.yaml es nuevo en este PR. Omitiendo comparación de breaking changes."
          fi

      # ── bff (HU-00.03) ───────────────────────────────────────────────────
      - name: pnpm install (bff)
        if: matrix.job == 'bff'
        run: pnpm --filter @animetracker/bff install

      - name: Lint bff
        if: matrix.job == 'bff'
        run: pnpm --filter @animetracker/bff run lint

      - name: "Build bff (CA3: regenerates the core client from the contract)"
        if: matrix.job == 'bff'
        run: pnpm --filter @animetracker/bff run build

      - name: Test bff (with coverage)
        if: matrix.job == 'bff'
        run: pnpm --filter @animetracker/bff run test:coverage

      # ── spa (HU-00.04) ───────────────────────────────────────────────────
      - name: pnpm install (spa)
        if: matrix.job == 'spa'
        run: pnpm --filter @animetracker/spa install

      - name: "Generate API client (CA4: regenerates from the public contract)"
        if: matrix.job == 'spa'
        run: pnpm --filter @animetracker/spa run gen:api

      - name: Lint spa (CA5)
        if: matrix.job == 'spa'
        run: pnpm --filter @animetracker/spa run lint

      - name: Build spa
        if: matrix.job == 'spa'
        run: pnpm --filter @animetracker/spa run build

      - name: Test spa (with coverage, CA5)
        if: matrix.job == 'spa'
        run: pnpm --filter @animetracker/spa run test:coverage

      # ── extension (stub — extended in HU-00.05) ──────────────────────────────
      - name: pnpm install (extension)
        if: matrix.job == 'extension'
        run: pnpm --filter @animetracker/extension install

      - name: extension build + test (stub)
        if: matrix.job == 'extension'
        run: |
          echo "extension job: no project yet — will be added in HU-00.05"

  # ── T1/CA1-CA2: Scan for secrets in PRs ─────────────────────────────────────
  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
          fail: true
          notify: false

  # ── T7: CA4 — single aggregator check (branch protection targets this) ──────
  ci-ok:
    name: ci-ok
    needs: [detect, run-job, secrets]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          # H3 fix: fail if detect itself failed (run-job would be 'skipped' but pipeline is broken)
          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "detect job failed or was skipped: ${{ needs.detect.result }}"
            exit 1
          fi
          if [ "${{ needs.run-job.result }}" != "success" ] && [ "${{ needs.run-job.result }}" != "skipped" ]; then
            echo "One or more CI jobs failed: ${{ needs.run-job.result }}"
            exit 1
          fi
          # T1/CA1: secrets job is only required to pass/skip (not fail) in PRs
          if [ "${{ needs.secrets.result }}" != "success" ] && [ "${{ needs.secrets.result }}" != "skipped" ]; then
            echo "Secrets scan failed: ${{ needs.secrets.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
