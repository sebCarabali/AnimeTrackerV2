name: OpenAPI Contracts CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]


jobs:
  verify-contracts:
    name: Lint & Breaking Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 es obligatorio para descargar el historial y poder comparar contra main
          fetch-depth: 0

      - name: Instalar Spectral CLI
        run: npm install -g @stoplight/spectral-cli

      - name: Ejecutar Lint de estilo (CA2)
        run: spectral lint contracts/public/bff.v1.yaml contracts/internal/core.v1.yaml

      - name: Instalar oasdiff
        run: |
          go install github.com/oasdiff/oasdiff@latest
          sudo mv $(go env GOPATH)/bin/oasdiff /usr/local/bin/

      - name: Detección de Breaking Changes - BFF Público (CA3)
        run: |
          if git rev-parse --verify origin/main:contracts/public/bff.v1.yaml >/dev/null 2>&1; then
            git show origin/main:contracts/public/bff.v1.yaml > /tmp/base-bff.yaml
            BASE_MAJOR=$(grep -m1 '^\s*version:' /tmp/base-bff.yaml | tr -d '"' | tr -d "'" | sed 's/.*version:[[:space:]]*//' | cut -d. -f1 || echo "0")
            PR_MAJOR=$(grep -m1 '^\s*version:' contracts/public/bff.v1.yaml | tr -d '"' | tr -d "'" | sed 's/.*version:[[:space:]]*//' | cut -d. -f1 || echo "0")
            if [ "${PR_MAJOR:-0}" -gt "${BASE_MAJOR:-0}" ]; then
              echo "Major version bumped (${BASE_MAJOR}.x → ${PR_MAJOR}.x): skipping breaking-change check for bff.v1.yaml."
            else
              oasdiff breaking /tmp/base-bff.yaml contracts/public/bff.v1.yaml --fail-on ERR
            fi
          else
            echo "El contrato bff.v1.yaml es nuevo en este PR. Omitiendo comparación de breaking changes."
          fi

      - name: Detección de Breaking Changes - Core Interno (CA3)
        run: |
          if git rev-parse --verify origin/main:contracts/internal/core.v1.yaml >/dev/null 2>&1; then
            git show origin/main:contracts/internal/core.v1.yaml > /tmp/base-core.yaml
            BASE_MAJOR=$(grep -m1 '^\s*version:' /tmp/base-core.yaml | tr -d '"' | tr -d "'" | sed 's/.*version:[[:space:]]*//' | cut -d. -f1 || echo "0")
            PR_MAJOR=$(grep -m1 '^\s*version:' contracts/internal/core.v1.yaml | tr -d '"' | tr -d "'" | sed 's/.*version:[[:space:]]*//' | cut -d. -f1 || echo "0")
            if [ "${PR_MAJOR:-0}" -gt "${BASE_MAJOR:-0}" ]; then
              echo "Major version bumped (${BASE_MAJOR}.x → ${PR_MAJOR}.x): skipping breaking-change check for core.v1.yaml."
            else
              oasdiff breaking /tmp/base-core.yaml contracts/internal/core.v1.yaml --fail-on ERR
            fi
          else
            echo "El contrato core.v1.yaml es nuevo en este PR. Omitiendo comparación de breaking changes."
          fi