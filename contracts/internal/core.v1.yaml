openapi: 3.1.0
info:
  title: AnimeTracker Core Internal API
  version: 1.0.0
  description: Internal API exposed by the .NET Modular Monolith to the BFF.
  contact:
    name: AnimeTracker Team
    email: dev@animetracker.local
servers:
  - url: http://localhost:5000
    description: Local development environment
  - url: https://staging-core.animetracker.local
    description: Staging environment
paths:
  /health:
    get:
      summary: Core health check endpoint
      description: Returns health status of the .NET modular monolith Host and modules.
      operationId: getCoreHealth
      tags:
        - Health
      responses:
        '200':
          description: Core service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreHealthStatus'
        '503':
          description: Core service or database unhealthy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    CoreHealthStatus:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          example: Healthy
        timestamp:
          type: string
          format: date-time
          example: '2026-10-31T20:00:00Z'
        entries:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
              description:
                type: string
    Problem:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
          example: 'https://tools.ietf.org/html/rfc9110#section-15.6.4'
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Service Unavailable
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 503
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Database connection timed out.
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem.
          example: '/errors/core-54321'
