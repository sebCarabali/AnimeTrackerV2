openapi: 3.1.0
info:
  title: AnimeTracker BFF Public API
  version: 1.0.0
  description: Public API exposed by the NestJS BFF to Angular SPA and Browser Extension.
  contact:
    name: AnimeTracker Team
    email: dev@animetracker.local
servers:
  - url: http://localhost:3000
    description: Local development environment
  - url: https://staging-api.animetracker.local
    description: Staging environment
paths:
  /health:
    get:
      summary: Health check endpoint for BFF and downstream dependencies
      description: Returns service health status and downstream connectivity.
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Service unavailable or unhealthy dependency
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /health/ready:
    get:
      summary: Readiness check endpoint
      description: Returns 200 only when the BFF and its downstream dependencies (core) are ready to serve traffic.
      operationId: getHealthReady
      tags:
        - Health
      responses:
        '200':
          description: Service and downstream dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: A downstream dependency is not ready
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
          example: '2026-10-31T20:00:00Z'
        dependencies:
          type: object
          additionalProperties:
            type: string
    Problem:
      type: object
      description: RFC 9457 Problem Details for HTTP APIs
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
          example: 'https://tools.ietf.org/html/rfc9110#section-15.6.4'
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Service Unavailable
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 503
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Downstream core service is not responding.
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem.
          example: '/errors/e-12345'
