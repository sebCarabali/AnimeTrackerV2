preguntas_abiertas:
  - { id: Q1, pregunta: "¿Qué plataformas de streaming soportará la extensión en R3?", afecta: [HU-06.02, HU-06.03], estado: abierta }
  - { id: Q2, pregunta: "¿Cuál es la concurrencia objetivo para la prueba de carga?", afecta: [HU-07.01], estado: abierta }
  - { id: Q3, pregunta: "¿Jikan, AniList o ambas como fuente de catálogo y horarios?", afecta: [HU-02.04, HU-05.05], estado: abierta }
  - { id: Q4, pregunta: "¿Login con proveedores externos (Google, Discord) además de email?", afecta: [EP-01], estado: abierta }
  - { id: Q5, pregunta: "¿Plataforma de staging (contenedores gestionados, Kubernetes, VM)?", afecta: [HU-00.06, HU-00.10, HU-00.11], estado: cerrada, decision: "Servidor único self-hosted (sin suscripciones adicionales), decisión final del PM tras evaluar ACA y AKS. Arquitectura: 1 VM con Docker Engine + Docker Compose (base: docker-compose.yml de HU-00.06 + docker-compose.staging.yml de overrides), Caddy/Traefik como reverse proxy (TLS automático) sirviendo la SPA y ruteando al BFF, GitHub Container Registry (gratis) como registro de imágenes. Despliegue: GitHub Actions con SSH-action ejecuta pull → migrator como job bloqueante (run --rm) → up -d → verificación GET /health/ready (CA2/CA3). CA4 (rollback): script guarda el tag previo y reintenta con él si el health check post-deploy falla. CA5 (serialización): concurrency group en el workflow + flock en el servidor como defensa adicional. Trade-off aceptado explícitamente por el equipo: sin alta disponibilidad, sin autoescalado, sin SLA; parcheo de SO/Docker y mantenimiento de los scripts de rollback/health-check a cargo del equipo. HU-00.06 amplía su alcance (ya no es solo-local). HU-00.11 usa Prometheus+Grafana+Loki/Promtail autohospedados en la misma VM en vez de Azure Monitor. Descartadas: ACA (no cumple el requisito de cero suscripciones) y AKS (costo de nodos 24/7 y carga operativa no justificados para 1-2 devs).", resuelta: 2026-11-01 }
  - { id: Q6, pregunta: "¿Se confirma 80 % de cobertura en código nuevo como umbral?", afecta: [HU-00.09], estado: cerrada, decision: "80 % de líneas en código nuevo; sin umbral global inicial", resuelta: 2026-10-31 }
  - { id: Q7, pregunta: "¿Licencia de MediatR v13+ o alternativa (Mediator con generador de código)?", afecta: [HU-00.02], estado: cerrada, decision: "MediatR v12 (última versión libre, sin licencia comercial)", resuelta: 2026-10-29 }

riesgos:
