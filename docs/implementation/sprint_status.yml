historial:
  - fecha: 2026-11-01
    cambio: >-
      HU-00.03 (0-3-bff-nestjs-inicial) promovida a pull-request tras code review iteración 4.
      APROBADA: 0 hallazgos ≥ MEDIA en los 5 ámbitos (aceptación, seguridad, diseño, arquitectura,
      pruebas). El único cambio desde la iteración 3 fue T11 (nuevo test unitario de
      node-fetch-adapter.ts, sin tocar código de producción). 1 sugerencia BAJA nueva registrada
      (node-fetch-adapter.spec.ts no afirma sobre el Response reconstruido, solo sobre los
      argumentos de node-fetch). 18/18 tests, cobertura 100%/100%/100%/100%. Siguiente paso:
      /story-pr 0-3.
  - fecha: 2026-11-01
    cambio: >-
      HU-00.03 (0-3-bff-nestjs-inicial) regresada a in-progress tras code review iteración 3.
      1 hallazgo MEDIA (Pruebas): node-fetch-adapter.ts no tiene prueba que ejercite la rama
      method !== GET/HEAD (serialización de body vía input.arrayBuffer()); reclasificado de
      BAJA (sugerencia registrada en iteraciones 1 y 2 bajo el supuesto "único uso hoy es GET")
      a MEDIA porque la cabecera de la propia historia confirma que bloquea HU-06.06 (ruta
      rápida de tracking, que usará POST), por lo que esa rama dejará de ser teórica en cuanto
      se implemente la historia que esta misma desbloquea. Aceptación, Seguridad, Diseño/SOLID
      y Arquitectura aprobados sin hallazgos ≥ MEDIA (solo sugerencias BAJA, la mayoría ya
      registradas en iteraciones previas; una nueva sobre falta de ExceptionFilter global para
      futuras rutas de negocio). T11 agregada con 1 ítem de corrección. 16/16 tests, cobertura
      100%/83.33%/100%/100% (sin cambio). Hallazgos de iteraciones 1 y 2 (T9, T10) confirmados
      corregidos sin regresión.
  - fecha: 2026-11-01
    cambio: >-
      HU-00.03 (0-3-bff-nestjs-inicial) promovida a review tras corrección T10 (iteración 2).
      3 hallazgos MEDIA corregidos: (1) allowlist de .gitleaks.toml anclado en los 3 patrones
      restantes (__fixtures__, fixtures/, testresults/) igual que las entradas ya corregidas en
      T9; (2) cambio estructural [[allowlist]] -> [allowlist] (T9) documentado en .gitleaks.toml
      y validado plantando un secreto private-key real en rutas exentas (__tests__/,
      __fixtures__/, fixtures/, TestResults/ -> 0 leaks) y en rutas señuelo no exentas
      (attestation.ts, legacy-fixtures/, nottestresults/ -> 3 leaks detectados); (3)
      readiness() ya no usa @Res() manual: lanza CoreUnavailableException, capturada por el
      nuevo ProblemJsonExceptionFilter (@Catch + @UseFilters), devolviendo la ruta de éxito al
      pipeline estándar de interceptores de Nest y dejando la construcción RFC 9457 en el punto
      de extensión sancionado por el framework. 16/16 tests sin cambios funcionales, cobertura
      100%/83.33%/100%/100% (sin cambio respecto a T9). Sin regresión en @animetracker/repo-checks
      (33/33) ni @animetracker/ci (18/18). Pendiente re-ejecución de /story-review.
  - fecha: 2026-11-01
    cambio: >-
      HU-00.03 (0-3-bff-nestjs-inicial) regresada a in-progress tras code review iteración 2.
      3 hallazgos MEDIA: (1) Seguridad — allowlist de .gitleaks.toml deja 3 patrones
      (__fixtures__, fixtures/, testresults/) con el mismo defecto de anclaje por subcadena
      que el patrón test.* ya corregido en T9; (2) Seguridad — cambio estructural
      [[allowlist]] a [allowlist] (T9) sin documentar ni verificar empíricamente con un
      secreto de prueba plantado; (3) Diseño — @Res() manual en readiness() (fix válido de
      T9 para Content-Type) saca esa ruta del pipeline de interceptores de Nest, riesgo para
      interceptores futuros de HU-00.11. Arquitectura y Pruebas (16/16, cobertura 83.33%
      branches) aprobadas sin hallazgos nuevos; los 6 hallazgos de iteración 1 confirmados
      corregidos de forma independiente. T10 agregada con 3 ítems de corrección.
