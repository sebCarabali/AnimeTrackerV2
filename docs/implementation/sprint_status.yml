  - { id: R-03, descripcion: "Defectos de infraestructura/configuración (YAML de GitHub Actions, reglas de gitleaks, umbral de cobertura) se detectan en code review manual en ciclos tardíos (2ª-4ª iteración) en vez de en un gate automatizado — patrón observado en HU-00.02 (9 hallazgos ≥MEDIA en 1ª iteración, cobertura <80%), HU-00.07 (4 iteraciones, typo \"stagin\" en ci.yml que rompía CI real en staging), HU-00.09 (H5 sin cerrar 3 ciclos consecutivos por evidencia CA4/CA5 no enlazada) y HU-00.03 (1 hallazgo CRÍTICO de YAML roto + 1 ALTA de regex de allowlist de gitleaks sin anclar). Riesgo de que se repita en HU-00.10/00.11 (sprint-2), que también tocan workflows de CI/CD e infraestructura.", probabilidad: alta, impacto: medio, mitigacion: "Retro sprint-1 (2026-11-01): agregar job de lint de YAML/Actions (actionlint o equivalente) en detect/run-job de ci.yml antes de cualquier otro job; mover el gate de cobertura ≥80% a bloqueante de CI en vez de hallazgo de code review; exigir matriz CA→evidencia (test/artefacto) explícita en la plantilla de PR y que story-review la valide, para que hallazgos como H5 no se reabran por ciclos sin cerrar. Dueño: Architect (gate de CI) + SM (plantilla PR / criterio de escalamiento tras 2 ciclos sin cerrar). Aplica antes de iniciar HU-00.10/00.11." }

