# =====================================================================
# sprint_status.yml — AnimeTracker
# Seguimiento de la ejecución del proyecto: releases, sprints, épicas
# e historias. Actualizar en cada cambio de estado (daily, review,
# planning) y registrar el cambio en "historial".
# Backlog fuente: "AnimeTracker — Épicas e Historias de Usuario"
# =====================================================================

proyecto:
  nombre: AnimeTracker
  backlog_url: https://claude.ai/artifact/VytB8NBVN1o9ffZBicHB51
  documentos: [PRD.md, ARD.md]
  carpeta_historias: stories/
  zona_horaria: America/Bogota
  generado: 2026-10-28
  actualizado: 2026-11-01  # Readiness review 0-3 iteración 4: require-review (2). RESUELTOS: T7 jest-openapi (Opción A), T4a DoD /health+/health/ready. PENDIENTE: enmendar ADR-003 §Decisión con openapi-fetch antes de iniciar T3. Corrección stale states: HU-00.08, HU-00.12a, HU-00.12b → done (mergeados sprint-1). Planning paralelización EP-00 sprint-2 (PM+SM+Architect): pistas definidas, grafo HU-00.11 corregido.
  cadencia_sprint: 2 semanas (10 días hábiles)
  velocidad_supuesta_pts: 24   # recalibrar tras el sprint-2 con la velocidad real

leyenda_estados:
  release: [planned, in-progress, done]
  sprint: [planned, active, closed]
  epica: [backlog, planned, in-progress, review, pull-request, done]
  historia:
    backlog: En el backlog, sin archivo de historia detallado.
    ready-for-dev: Archivo de historia con criterios y plan TDD listo; puede entrar a un sprint.
    in-progress: En desarrollo (primera prueba en rojo escrita).
    review: PR abierto, CI en verde, en revisión.
    done: Mergeado a main, DoD cumplida y desplegado en staging.
    blocked: Bloqueada; indicar motivo en "bloqueo".

metricas:
  historias_total: 52
  puntos_total: 196
  historias_done: 8   # 0-1 (3), 0-2 (5), 0-3 (3), 0-7 (5), 0-8 (3), 0-9 (5), 0-12a (1.5), 0-12b (1.5)
  puntos_done: 27
  historias_review: 0
  puntos_review: 0
  historias_ready_for_dev: 5   # 0-4, 0-5, 0-6, 0-10, 0-11 (sprint-2)
  avance_pct: 13   # puntos_done / puntos_total (27/196)

releases:
  - id: R0
    nombre: Fundaciones
    hito: Todo corre en CI
    estado: planned
    alcance: [EP-00, HU-07.02]
    sprints: [sprint-1, sprint-2]
  - id: R1
    nombre: MVP manual
    hito: Uso manual total
    estado: planned
    alcance: [EP-01, EP-02, EP-03, EP-04, HU-07.03]
  - id: R2
    nombre: Calendario
    hito: Plan semanal en hora local
    estado: planned
    alcance: [EP-05]
  - id: R3
    nombre: Auto-tracking
    hito: p95 de POST /api/v1/track menor a 200 ms
    estado: planned
    alcance: [EP-06, HU-07.01, HU-07.04]
  - id: post-mvp
    nombre: Después del MVP (Could)
    estado: planned
    alcance: [HU-01.05, HU-03.08, HU-05.06, HU-06.07]

sprints:
  - id: sprint-1
    release: R0
    inicio: 2026-11-02
    fin: 2026-11-13
    estado: closed   # Cerrado 2026-11-01, adelantado respecto al fin planeado (2026-11-13): alcance 100% completado
    objetivo: >-
      Monorepo, CI por proyectos afectados, solución .NET modular con
      pruebas de arquitectura, contratos OpenAPI y persistencia por esquema.
    capacidad_pts: 24
    comprometido_pts: 24
    completado_pts: 24   # 100%: HU-00.01, 00.02, 00.07, 00.08, 00.09, 00.12a, 00.12b, todas done y mergeadas a dev
    en_review_pts: 0
    adelantado_de_sprint2_pts: 3   # HU-00.03 (BFF NestJS inicial) adelantada y mergeada (PR #21) — valor entregado total: 27 pts
    historias:
      - 0-1-estructura-del-monorepo
      - 0-2-solucion-net-monolito-modular
      - 0-7-contratos-openapi-primero
      - 0-8-persistencia-migraciones-por-modulo
      - 0-9-pipeline-integracion-continua
      - 0-12a-secretos-ci-config
      - 0-12b-validateenv-bff
    review: 2026-11-02 (correcciones code review completadas)
    retro: 2026-11-01 (ejecutada; adelantada respecto al 2026-11-13 planeado porque el equipo terminó el sprint antes)

  - id: sprint-2
    release: R0
    inicio: 2026-11-02   # Adelantado desde el 2026-11-16 planeado: sprint-1 cerró 100% el 2026-11-01, ~2 semanas antes de su fin planeado; el SM decidió en Sprint Planning (2026-11-01) reutilizar ese hueco de calendario para no perder cadencia (cadencia_sprint: 2 semanas/10 días hábiles se preserva).
    fin: 2026-11-13
    estado: active   # Iniciado en Sprint Planning 2026-11-01; arranque de desarrollo 2026-11-02.
    objetivo: >-
      BFF, SPA y extensión inicializados; entorno local con un comando
      (ahora también base de staging); despliegue continuo a staging y
      observabilidad de punta a punta, sobre la decisión de Q5 (servidor
      único self-hosted).
    capacidad_pts: 24
    comprometido_pts: 22   # 24 - 2 (HU-07.02 retirada del compromiso: no cumple DoR, ver nota en la historia)
    completado_pts: 0
    historias:
      - 0-3-bff-nestjs-inicial
      - 0-4-spa-angular-inicial
      - 0-5-esqueleto-extension-navegador
      - 0-6-entorno-local-docker-compose
      - 0-10-despliegue-continuo-staging
      - 0-11-observabilidad-base
    review: null
    retro: null
    planning: 2026-11-01 (ejecutado; ver historial para objetivo, alcance confirmado y decisiones)
    acciones_retro_sprint1:   # Acciones concretas acordadas en la retro de sprint-1 (2026-11-01), a ejecutar durante sprint-2
      - { id: ACC-01, accion: "Agregar job de lint de YAML/Actions (actionlint o equivalente) en ci.yml, antes de cualquier otro job, para atrapar YAML roto y typos de rama automáticamente", dueño: Architect, ambito: "ci.yml — afecta HU-00.10, HU-00.11", estado: pendiente, bloqueante: false, nota_sm: "Paralelo al día 1; debe estar listo antes de que HU-00.10/HU-00.11 abran sus primeros PRs con workflows de CI/CD nuevos." }
      - { id: ACC-02, accion: "Convertir el umbral de cobertura ≥80% en gate bloqueante de CI (falla el PR) en vez de hallazgo de code review", dueño: "Architect + Dev", ambito: "Pipeline CI", estado: pendiente, bloqueante: false, nota_sm: "Paralelo; idealmente antes del primer PR mergeado del sprint para que el gate aplique desde el inicio." }
      - { id: ACC-03, accion: "Exigir matriz CA→evidencia (test/artefacto) explícita en la plantilla de PR y que story-review la valide; escalar a ADR o excepción documentada si un hallazgo sobrevive 2 ciclos sin cerrar", dueño: "Scrum Master", ambito: "Proceso story-review", estado: pendiente, bloqueante: false, nota_sm: "Paralelo; el SM la deja lista antes de que la primera historia de sprint-2 llegue a estado review." }
      - { id: ACC-04, accion: "Añadir checklist de autochequeo pre-PR (lint local + cobertura local) vía hook de Husky adicional", dueño: Dev, ambito: "Todas las historias de sprint-2", estado: pendiente, bloqueante: false, nota_sm: "Paralelo; no bloquea el inicio de ninguna historia." }
      - { id: ACC-05, accion: "Documentar guardrails de negocio no negociables (costo, SLA, compliance) como precondición del ADR, antes de evaluar opciones de arquitectura", dueño: PM, ambito: "HU-00.06, HU-00.10, HU-00.11 (decisiones de infraestructura)", estado: satisfecha, bloqueante: false, nota_sm: "Satisfecha de facto: el guardrail 'cero suscripciones adicionales' ya quedó documentado como precondición explícita dentro de la decisión de Q5 (preguntas_abiertas) antes de cerrarla. No bloquea." }
      - { id: ACC-06, accion: "Exigir desglose en tareas con horas estimadas antes del readiness review para toda historia ≥3 pts o con dependencias externas", dueño: PM, ambito: "Refinamiento previo a sprint-2", estado: pendiente, bloqueante: false, nota_sm: "No aplica retroactivamente a 0-4/0-5/0-6/0-10/0-11 (ya con readiness aprobado); se exige desde ya en el refinamiento de HU-07.02 y de cara a sprint-3." }
      - { id: ACC-06b, accion: "(Derivada de ACC-06, decidida en este planning) Completar el archivo de historia detallado de HU-07.02 (fechas UTC en contratos) y pasar por story-readiness antes de comprometerla en un sprint", dueño: PM, ambito: "HU-07.02", estado: pendiente, bloqueante: false, nota_sm: "HU-07.02 queda fuera del compromiso de sprint-2 (no cumple DoR). Candidata a sprint-3 una vez resuelto esto." }
      - { id: ACC-07, accion: "Redactar ADR de la decisión self-hosted (Q5) con la cadena de descartes (ACA → AKS → self-hosted) como contexto reusable, antes de iniciar HU-00.06", dueño: Architect, ambito: "HU-00.06", estado: pendiente, bloqueante: true, nota_sm: "BLOQUEANTE DURA para HU-00.06: Dev no debe tomar la historia hasta que el ADR exista (Q5 ya tiene toda la decisión redactada en preguntas_abiertas, por lo que el ADR es en gran parte transcripción — se espera < 1 día). No bloquea HU-00.04 ni HU-00.05, que pueden iniciar de inmediato." }
      - { id: ACC-08, accion: "Comunicar en el planning de sprint-2 que la capacidad extra usada para adelantar HU-00.03 no es la baseline esperada, para no inflar el compromiso", dueño: PM, ambito: "Sprint-2 planning", estado: ejecutada, bloqueante: false, nota_sm: "Ejecutada en este Sprint Planning (2026-11-01): velocidad_supuesta_pts se mantiene en 24 (no 27); comprometido_pts de sprint-2 (22) se fija sobre la capacidad base, sin inflar por el adelanto de HU-00.03." }

