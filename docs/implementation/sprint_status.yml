  - fecha: 2026-11-01
    cambio: >-
      Sprint Retrospective de sprint-1 (EP-00, R0) facilitada por el SM con aportes de PM,
      Architect, Dev y QA. Sprint cerrado 100% del alcance comprometido (24/24 pts) más 3 pts
      adelantados de sprint-2 (HU-00.03), 27 pts de valor entregado. Qué funcionó: cobertura de
      pruebas mejoró iteración a iteración dentro del sprint (HU-00.02 bajo umbral -> HU-00.09
      89.71% -> HU-00.07 93.75% -> HU-00.03 100%); el readiness review detectó a tiempo la
      subestimación de HU-00.12 (2 pts vs. ~10-11h reales) y permitió dividirla en 00.12a/00.12b;
      el equipo cerró todo el alcance y adelantó trabajo de sprint-2. Qué no funcionó: code
      review con iteraciones largas y regresivas (HU-00.02: 2 iteraciones/9 hallazgos ≥MEDIA;
      HU-00.07: 4 iteraciones incl. typo "stagin" en ci.yml; HU-00.09: 3 iteraciones con H5
      pendiente por 3 ciclos consecutivos por evidencia CA4/CA5 no enlazada; HU-00.03: 4
      iteraciones incl. 1 CRÍTICA de YAML roto y 1 ALTA de regex de gitleaks sin anclar) por
      ausencia de gates automatizados (lint de YAML/Actions, cobertura bloqueante, trazabilidad
      CA-evidencia) que detectan estos defectos en segundos en vez de ciclos de revisión humana;
      Q5/Q6/Q7 se cerraron tarde (ya cursando o terminando el sprint) por tratarse como bloqueos
      ad-hoc en vez de parte del Definition of Ready; Q5 tuvo que reabrirse (ACA -> AKS ->
      self-hosted) porque la restricción de negocio del PM (cero suscripciones) se validó
      después de proponer la primera opción de arquitectura, no antes, generando retrabajo y
      bloqueando temporalmente HU-00.06/00.10/00.11. Acciones para sprint-2: (1) job de lint de
      YAML/Actions (actionlint) en ci.yml antes de cualquier otro job — dueño Architect; (2)
      gate de cobertura ≥80% bloqueante en CI, no hallazgo de review — dueño Architect/Dev; (3)
      matriz CA->evidencia obligatoria en PR/story-review, con escalamiento a ADR si un hallazgo
      sobrevive 2 ciclos sin cerrar — dueño SM; (4) checklist de autochequeo pre-PR (lint local +
      cobertura) vía Husky — dueño Dev; (5) guardrails de negocio no negociables (costo, SLA,
      compliance) documentados por el PM antes de evaluar opciones de arquitectura, como
      precondición del ADR — dueño PM, aplica a toda decisión de infraestructura de HU-00.06/
      00.10/00.11; (6) desglose en tareas con horas estimadas obligatorio antes de readiness
      review para toda historia ≥3 pts o con dependencias externas — dueño PM. Riesgo R-03
      registrado (gates automatizados pendientes). Ver historias/0-x para detalle de aportes
      por rol.
