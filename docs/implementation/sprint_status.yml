# =====================================================================
# sprint_status.yml — AnimeTracker
# Seguimiento de la ejecución del proyecto: releases, sprints, épicas
# e historias. Actualizar en cada cambio de estado (daily, review,
# planning) y registrar el cambio en "historial".
# Backlog fuente: "AnimeTracker — Épicas e Historias de Usuario"
# =====================================================================

proyecto:
  nombre: AnimeTracker
  backlog_url: https://claude.ai/artifact/VytB8NBVN1o9ffZBicHB51
  documentos: [PRD.md, ARD.md]
  carpeta_historias: stories/
  zona_horaria: America/Bogota
  generado: 2026-10-28
  actualizado: 2026-11-01  # Readiness review 0-3 iteración 4: require-review (2). RESUELTOS: T7 jest-openapi (Opción A), T4a DoD /health+/health/ready. PENDIENTE: enmendar ADR-003 §Decisión con openapi-fetch antes de iniciar T3. Corrección stale states: HU-00.08, HU-00.12a, HU-00.12b → done (mergeados sprint-1).
  cadencia_sprint: 2 semanas (10 días hábiles)
  velocidad_supuesta_pts: 24   # recalibrar tras el sprint-2 con la velocidad real

leyenda_estados:
  release: [planned, in-progress, done]
  sprint: [planned, active, closed]
  epica: [backlog, planned, in-progress, review, pull-request, done]
  historia:
    backlog: En el backlog, sin archivo de historia detallado.
    ready-for-dev: Archivo de historia con criterios y plan TDD listo; puede entrar a un sprint.
    in-progress: En desarrollo (primera prueba en rojo escrita).
    review: PR abierto, CI en verde, en revisión.
    done: Mergeado a main, DoD cumplida y desplegado en staging.
    blocked: Bloqueada; indicar motivo en "bloqueo".

metricas:
  historias_total: 52
  puntos_total: 196
  historias_done: 7   # 0-1 (3), 0-2 (5), 0-7 (5), 0-9 (5), 0-8 (3), 0-12a (1.5), 0-12b (1.5)
  puntos_done: 24
  historias_review: 4   # 0-8 (PR), 0-12a (PR), 0-12b (PR) — listos para merge; 0-3 (review, sprint-2)
  puntos_review: 9
  historias_ready_for_dev: 6   # 0-3, 0-4, 0-5, 0-6, 0-10, 0-11 (sprint-2)
  avance_pct: 12   # puntos_done / puntos_total (24/196)

